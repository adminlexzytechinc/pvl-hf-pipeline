# Read-only diagnostics against Google Drive. Neither probe downloads a file.
#
#   quota    Is the download quota counted per FILE or per REQUESTER?
#            This decides whether adding accounts helps at all. If the quota
#            is per-file and global, every identity meets the same wall and
#            more accounts only help by providing STORAGE for a copy. If it
#            has a per-requester component, a file can be pulled in slices by
#            several identities and reassembled. Reads a few KB.
#
#   takeout  Can a service account drive the Takeout export API, which is what
#            Drive's own Download button uses for a folder?
#            ANSWERED: no. Every scope returns 403 naming
#            google.internal.takeout.v1.TakeoutService.CreateExport -- an
#            internal service with no public scope. Kept for reproducibility.
#            Creates only a folder and a shortcut (a pointer, 0 bytes) and
#            deletes them even on failure.
#
# Both are safe to run repeatedly. Point them at a file you KNOW is blocked --
# that is the only case where either answer matters.
name: Drive diagnostics

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Drive file id to test against (a quota-BLOCKED one is ideal)'
        required: true
        default: '1Ng-ZZohoDMOffS6Cw1BqmwqCMLQy0BHk'
      probe:
        description: 'Which diagnostic to run'
        required: true
        default: 'quota'
        type: choice
        options: [quota, takeout, both]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyjwt cryptography

      - name: Write SA credentials
        env:
          SA_JSON: ${{ secrets.SA_CREDENTIALS_JSON }}
        run: |
          echo "$SA_JSON" > /tmp/sa_credentials.json
          chmod 600 /tmp/sa_credentials.json

      - name: Is the quota per-file or per-requester?
        if: ${{ inputs.probe == 'quota' || inputs.probe == 'both' }}
        env:
          SA_CREDENTIALS_PATH: /tmp/sa_credentials.json
        run: python test_quota_model.py "${{ inputs.file_id }}"

      - name: Can the service account drive Takeout?
        if: ${{ inputs.probe == 'takeout' || inputs.probe == 'both' }}
        env:
          SA_CREDENTIALS_PATH: /tmp/sa_credentials.json
        run: python test_takeout_sa.py "${{ inputs.file_id }}"

      # The probe exits non-zero when no scope is accepted, which is a valid
      # answer rather than a broken run. Say so plainly in the log.
      - name: Read the result
        if: always()
        run: |
          echo "200 in the log        -> the SA can drive Takeout. Build on it."
          echo "403 naming a scope    -> add that scope and re-run."
          echo "403 with no scope     -> first-party only; free Drive space and"
          echo "                         use GAS copy instead, which beats the"
          echo "                         quota the same way (a copy is a new object)."
          echo "401                   -> the SA identity is refused outright."
