name: PVL HF Build Worker

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Google Drive file ID'
        required: true
      file_name:
        description: 'Original filename (clean, no watermarks)'
        required: true
      callback_url:
        description: 'WordPress progress callback URL'
        required: true
      build_id:
        description: 'Unique build ID for progress tracking'
        required: true
      exclude_patterns:
        description: 'Newline-separated glob patterns to exclude'
        required: false
        default: ''
      hf_repo_slug:
        description: 'Target repo slug from pool config (e.g., fw-1, iso-1)'
        required: false
        default: ''
      hf_repo_id:
        description: 'Full HF repo ID (e.g., adminlexzytech/phone-firmware)'
        required: false
        default: ''
      source_type:
        description: 'Source type (gdrive, mediafire)'
        required: false
        default: 'gdrive'
      source_url:
        description: 'Original download page URL'
        required: false
        default: ''
      dual_build:
        description: 'Build both clean and branded versions (true/false)'
        required: false
        default: 'false'
      serve_time_branding:
        description: 'Store one brand-neutral archive; the Worker appends branding per request (true/false). Overrides dual_build.'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    # Raised from 60 on 2026-09-24: a quota-blocked file fetched in slices can
    # take hours. GitHub stops any job at 360; WordPress treats a build as dead
    # at 370 (pvl_hf_clean_stale_builds), so the two cannot disagree.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system archive utilities
        run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar megatools

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests PyJWT cryptography huggingface-hub; fi

      - name: Write SA credentials
        env:
          SA_JSON: ${{ secrets.SA_CREDENTIALS_JSON }}
        run: |
          echo "$SA_JSON" > /tmp/sa_credentials.json

      - name: Extract HF token for target repo
        id: get-token
        env:
          SLUG: ${{ inputs.hf_repo_slug }}
          HF_ACCOUNTS_JSON: ${{ secrets.HF_ACCOUNTS }}
          FALLBACK_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$SLUG" ] && [ -n "$HF_ACCOUNTS_JSON" ]; then
            TOKEN=$(python3 -c "import os, json; accounts = json.loads(os.environ.get('HF_ACCOUNTS_JSON', '{}')); print(accounts.get(os.environ.get('SLUG', ''), ''))")
            if [ -n "$TOKEN" ]; then
              echo "::add-mask::$TOKEN"
              echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
              echo "Found token for repo slug: $SLUG"
            else
              echo "No token for slug $SLUG, using fallback"
              echo "::add-mask::$FALLBACK_TOKEN"
              echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Using legacy HF_TOKEN"
            echo "::add-mask::$FALLBACK_TOKEN"
            echo "token=$FALLBACK_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine HF repo ID
        id: get-repo
        run: |
          if [ -n "${{ inputs.hf_repo_id }}" ]; then
            echo "repo_id=${{ inputs.hf_repo_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo_id=adminlexzytech/phone-firmware" >> "$GITHUB_OUTPUT"
          fi

      # Firmware archives run to tens of gigabytes, and the worker holds the
      # download, the full extraction and the output on disk at once. Both
      # tempfile.mkdtemp() calls land on /tmp, which is the SMALL volume.
      #
      # This step reports the truth and moves the work to whichever volume is
      # actually largest. No third-party action: everything here is a shell
      # builtin, and nothing is removed that the build needs.
      - name: Free disk and choose the largest volume
        run: |
          echo "=== before ==="
          df -h / /mnt 2>/dev/null || df -h /

          # Reclaim space the build never uses. Each is a preinstalled toolchain
          # that this workflow does not touch; failures are ignored on purpose
          # because the runner image changes and a missing path is not an error.
          sudo rm -rf /usr/share/dotnet                  || true
          sudo rm -rf /usr/local/lib/android             || true
          sudo rm -rf /opt/ghc                           || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL        || true
          sudo rm -rf /usr/local/share/boost             || true
          sudo rm -rf /usr/local/share/powershell        || true
          sudo docker image prune --all --force          || true

          echo "=== after ==="
          df -h / /mnt 2>/dev/null || df -h /

          # Put temporary work on the biggest writable volume. /mnt is a
          # separate, larger disk on GitHub-hosted runners, but do not assume
          # it exists -- fall back to /tmp and say which was chosen.
          WORKDIR=/tmp
          if [ -d /mnt ] && sudo mkdir -p /mnt/pvl-tmp 2>/dev/null; then
            sudo chmod 777 /mnt/pvl-tmp
            AVAIL_MNT=$(df -Pk /mnt | awk 'NR==2 {print $4}')
            AVAIL_TMP=$(df -Pk /tmp | awk 'NR==2 {print $4}')
            if [ "${AVAIL_MNT:-0}" -gt "${AVAIL_TMP:-0}" ]; then
              WORKDIR=/mnt/pvl-tmp
            fi
          fi
          echo "TMPDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "Temporary work will use: $WORKDIR"
          df -h "$WORKDIR"

      - name: Run build worker
        env:
          SA_CREDENTIALS_PATH: /tmp/sa_credentials.json
          GAS_BRIDGE_URL: ${{ secrets.GAS_BRIDGE_URL }}
          GAS_BRIDGE_SECRET: ${{ secrets.GAS_BRIDGE_SECRET }}
          BUILD_CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
          MEGA_USER: ${{ secrets.MEGA_USER }}
          MEGA_PASS: ${{ secrets.MEGA_PASS }}
          HF_REPO_ID: ${{ steps.get-repo.outputs.repo_id }}
          HF_TOKEN: ${{ steps.get-token.outputs.token }}
          FILE_ID: ${{ inputs.file_id }}
          FILE_NAME: ${{ inputs.file_name }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_URL: ${{ inputs.source_url }}
          DUAL_BUILD: ${{ inputs.dual_build }}
          SERVE_TIME_BRANDING: ${{ inputs.serve_time_branding }}
          DEDUP_API_URL: ${{ secrets.DEDUP_API_URL }}
          DEDUP_API_TOKEN: ${{ secrets.DEDUP_API_TOKEN }}
        # -u is load-bearing. Without it Python buffers stdout, and a build
        # killed by timeout-minutes loses everything it printed: run
        # 35868500541 ran the full 60 minutes on a MEGA file and its log
        # ends at the env block, with not even the worker's banner.
        run: python -u hf_build_worker.py

      - name: Report disk on failure
        if: failure()
        run: |
          echo "Build failed. Disk at time of failure:"
          df -h / /mnt "${TMPDIR:-/tmp}" 2>/dev/null || df -h /

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/sa_credentials.json
